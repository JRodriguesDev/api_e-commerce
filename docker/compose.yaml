services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - api
  node:
    build: 
      context: ..
      dockerfile: docker/app.dockerfile
    container_name: app
    env_file:
      - ../.env
    ports:
      - 3000:3000
    volumes:
      - prisma-migrate:/app/migrate
    networks:
      - api
    depends_on:
      - postgres
  stripe_cli:
    image: stripe/stripe-cli:latest
    container_name: stripe
    command: listen --forward-to http://node:3000/webhooks/stripe
    networks:
      - api
    depends_on:
      - node
  redis:
    build: 
      context: ..
      dockerfile: docker/redis.dockerfile
    container_name: redis
    ports:
      - 6379:6379
    volumes:
      - redis-cache:/data
    networks:
      - api
    depends_on:
      - node
volumes:
  postgres-volume:
  prisma-migrate:
  redis-cache:
networks:
  api:
    driver: bridge