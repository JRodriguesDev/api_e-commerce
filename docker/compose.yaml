services:
  mongo:
    build:
      context: ..
      dockerfile: docker/mongodb.dockerfile
    container_name: mongo
    ports:
      - 27017:27017
    volumes:
      - mongo-volume:/data/db
    networks:
      - api
  node:
    build: 
      context: ..
      dockerfile: docker/app.dockerfile
    container_name: app
    env_file:
      - ../.env
    ports:
      - 3000:3000
    networks:
      - api
    depends_on:
      - mongo
volumes:
  mongo-volume:
networks:
  api:
    driver: bridge
