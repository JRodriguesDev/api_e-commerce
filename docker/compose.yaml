services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - api
  node:
    build: 
      context: ..
      dockerfile: docker/app.dockerfile
    container_name: app
    env_file:
      - ../.env
    ports:
      - 3000:3000
    volumes:
      - prisma-migrate:/app/migrate
    networks:
      - api
    depends_on:
      - postgres
volumes:
  postgres-volume:
  prisma-migrate:
networks:
  api:
    driver: bridge
